<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Rental Place - Store Owners</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>🏪 Market Rental Place</h1><p>List your store in the app for R50 / month</p></header>
<main>
<div id="auth" class="card"><h2 id="atitle">Store owner login</h2>
<div id="nameRow" class="hide"><label>Your name</label><input id="name"></div>
<label>Email</label><input id="email" type="email"><label>Password</label><input id="pw" type="password">
<button onclick="doAuth()" id="abtn">Log in</button><button class="grey" onclick="toggle()" id="tbtn">Create an account</button>
<div class="err" id="aerr"></div></div>

<div id="dash" class="hide">
<div id="mine" class="card hide"><h2>🎉 Your store is live</h2><p class="muted" id="mineTxt"></p><button class="amber" onclick="window.open(mineUrl,'_blank')">Open my store</button></div>
<div class="card"><h2>Your store</h2><div id="status"></div>
<label>Store name</label><input id="sname" placeholder="Banana Store">
<label>Website link</label><input id="surl" placeholder="https://bananastore.co.za">
<label>Icon (an emoji, e.g. 🍌)</label><input id="slogo" maxlength="4">
<button onclick="saveStore()">Save store</button><div class="err" id="serr"></div></div>
<div class="card"><h2>Subscription</h2><p class="muted" id="paidInfo">R50 per month, paid securely with PayFast. Your store goes live in the app once it is approved and paid.</p>
<button class="amber" onclick="pay()">Pay R50 with PayFast</button>
<button class="grey hide" id="sim" onclick="sim()">Simulate payment (testing only)</button>
<div class="err" id="perr"></div></div>
<button class="grey" onclick="logout()">Log out</button></div></main>
<form id="pf" method="post" class="hide"></form>
<script>
let mineUrl="",reg=false,tok=localStorage.mrp||"";
const $=i=>document.getElementById(i);
const api=async(p,b)=>{const r=await fetch(p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok},body:b?JSON.stringify(b):undefined});
const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Something went wrong");return d};
function toggle(){reg=!reg;$("nameRow").classList.toggle("hide",!reg);$("atitle").textContent=reg?"Create owner account":"Store owner login";$("abtn").textContent=reg?"Sign up":"Log in";$("tbtn").textContent=reg?"I already have an account":"Create an account"}
async function doAuth(){try{const d=await api(reg?"/api/register":"/api/login",{email:$("email").value,password:$("pw").value,name:$("name").value});tok=d.token;localStorage.mrp=tok;load()}catch(e){$("aerr").textContent=e.message}}
function logout(){localStorage.removeItem("mrp");tok="";$("dash").classList.add("hide");$("auth").classList.remove("hide")}
async function load(){if(!tok)return;try{const m=await api("/api/me");if(m.role==="admin"){location.href="/admin.html";return}$("auth").classList.add("hide");$("dash").classList.remove("hide");
const s=m.store;if(s){$("sname").value=s.name;$("surl").value=s.url;$("slogo").value=s.logo||""}
let b='<span class="badge wait">Not added yet</span>';
if(s){b=m.live?'<span class="badge ok">LIVE in the app</span>':!s.approved?'<span class="badge wait">Waiting for approval</span>':'<span class="badge bad">Approved - payment needed</span>';
if(s.paidUntil)$("paidInfo").textContent="Paid until "+s.paidUntil+". Pay again any time to add another month."}
$("status").innerHTML=b;$("mine").classList.toggle("hide",!m.live);if(m.live){mineUrl=s.url;$("mineTxt").textContent=s.name+" is visible to customers in the Market Rental Place app until "+s.paidUntil+". Customers open it and log in on your website."}if(m.devMode)$("sim").classList.remove("hide")}catch(e){logout()}}
async function saveStore(){try{await api("/api/store",{name:$("sname").value,url:$("surl").value,logo:$("slogo").value});$("serr").textContent="";load()}catch(e){$("serr").textContent=e.message}}
async function pay(){try{const d=await api("/api/pay",{});const f=$("pf");f.action=d.action;f.innerHTML=d.fields.map(([k,v])=>`<input type="hidden" name="${k}" value="${String(v).replace(/"/g,"&quot;")}">`).join("");f.submit()}catch(e){$("perr").textContent=e.message}}
async function sim(){try{await api("/api/dev/simulate-payment",{});load()}catch(e){$("perr").textContent=e.message}}
load();
</script></body></html>
