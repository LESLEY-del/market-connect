<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRP Admin</title><link rel="stylesheet" href="/style.css"></head><body>
<header><h1>🛡️ Admin dashboard</h1><p>Market Rental Place</p></header><main>
<div id="login" class="card"><h2>Admin login</h2><label>Email</label><input id="email" type="email"><label>Password</label><input id="pw" type="password">
<button onclick="doLogin()">Log in</button><div class="err" id="e"></div></div>
<div id="app" class="hide"><div class="card"><div id="stats"></div><button class="grey" onclick="logout()">Log out</button></div><div id="list"></div></div></main>
<script>
const $=i=>document.getElementById(i);let tok=sessionStorage.at||"";
const call=async(p,m)=>{const r=await fetch(p,{method:m||"GET",headers:{Authorization:"Bearer "+tok,"Content-Type":"application/json"},body:m?"{}":undefined});
const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Error");return d};
async function doLogin(){try{const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("pw").value})});
const d=await r.json();if(!r.ok)throw new Error(d.error);if(d.role!=="admin")throw new Error("This account is not an admin");tok=d.token;sessionStorage.at=tok;load()}catch(e){$("e").textContent=e.message}}
function logout(){sessionStorage.removeItem("at");tok="";$("app").classList.add("hide");$("login").classList.remove("hide")}
async function load(){try{const d=await call("/api/admin/stores");$("login").classList.add("hide");$("app").classList.remove("hide");
const live=d.filter(s=>s.live).length,wait=d.filter(s=>!s.approved).length;
$("stats").innerHTML=`<b>${d.length}</b> stores · <b>${live}</b> live · <b>${wait}</b> waiting approval · Income: <b>R${live*50}</b>/month`;
$("list").innerHTML=d.map(s=>`<div class="card"><b>${esc(s.logo||"🏪")} ${esc(s.name)}</b> ${s.live?'<span class="badge ok">LIVE</span>':'<span class="badge wait">not live</span>'}
<p class="muted">${esc(s.owner||"")}<br><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.url)}</a><br>Approved: ${s.approved?"yes":"no"} · Hidden: ${s.hidden?"yes":"no"} · Paid until: ${s.paidUntil||"never"}</p>
<button class="small" onclick="act('${s.id}','approve')">Approve</button><button class="small amber" onclick="act('${s.id}','activate')">Payment received +1 month</button>
<button class="small grey" onclick="act('${s.id}','${s.hidden?"unhide":"hide"}')">${s.hidden?"Unhide":"Hide"}</button><button class="small grey" onclick="if(confirm('Delete this store?'))act('${s.id}','delete')">Delete</button></div>`).join("")||'<p class="muted">No stores yet.</p>'}catch(e){if(tok)logout()}}
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function act(id,a){await call(`/api/admin/stores/${id}/${a}`,"POST");load()}
if(tok)load();
</script></body></html>
